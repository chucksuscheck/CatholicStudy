<html lang="en">
<head>
<meta charset="utf-8">

<title>The Apostles’ Creed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">

</head>
<body>
<noscript>This memory practice needs JavaScript.</noscript>
<script>
window.PRAYER={
 key:"apc",title:"The Apostles’ Creed",eyebrow:"Symbolum Apostolorum",incipit:"Credo in Deum Patrem omnipotentem…",
 emblem:"apostles",heroPos:"30% 45%",placeholder:"I believe in…",
 decoys:["One Baptism","His public ministry","The four marks of the Church"],
 about:["Grown from the ancient baptismal creed of the Church of Rome, it is called the Apostles’ Creed because it is a faithful summary of the Apostles’ faith.",
        "It may be professed at Mass in place of the Nicene Creed, especially in Lent and Easter Time."],
 moves:[
 {name:"The Father",hook:"<strong>God → Father → Creator.</strong> Who he is, then what he made.",
  lines:["I believe in God, the Father almighty,","Creator of heaven and earth,"],
  latin:["Credo in Deum Patrem omnipotentem,","Creatorem caeli et terrae,"]},
 {name:"The Son",hook:"<strong>Three titles:</strong> his only Son, our Lord. “And in” links him to the Father.",
  lines:["and in Jesus Christ, his only Son, our Lord,"],
  latin:["et in Iesum Christum, Filium eius unicum, Dominum nostrum,"]},
 {name:"His life and death",hook:"<strong>Conceived, born, suffered, crucified.</strong> Then the triple: crucified, died and was buried.",
  lines:["who was conceived by the Holy Spirit,","born of the Virgin Mary,","suffered under Pontius Pilate,","was crucified, died and was buried;"],
  latin:["qui conceptus est de Spiritu Sancto,","natus ex Maria Virgine,","passus sub Pontio Pilato,","crucifixus, mortuus, et sepultus,"]},
 {name:"His victory",hook:"<strong>Down, up, up, seated, returning.</strong> Hell → rose → ascended → seated → will come to judge.",
  lines:["he descended into hell;","on the third day he rose again from the dead;","he ascended into heaven,","and is seated at the right hand of God the Father almighty;","from there he will come to judge the living and the dead."],
  latin:["descendit ad inferos,","tertia die resurrexit a mortuis,","ascendit ad caelos,","sedet ad dexteram Dei Patris omnipotentis,","inde venturus est iudicare vivos et mortuos."]},
 {name:"The Spirit and the Church",hook:"<strong>Spirit, then five gifts:</strong> Church, communion, forgiveness, resurrection, life. Think “C-C-F-R-L.”",
  lines:["I believe in the Holy Spirit,","the holy catholic Church,","the communion of saints,","the forgiveness of sins,","the resurrection of the body,","and life everlasting. Amen."],
  latin:["Credo in Spiritum Sanctum,","sanctam Ecclesiam catholicam,","sanctorum communionem,","remissionem peccatorum,","carnis resurrectionem,","vitam aeternam. Amen."]}
 ]};
</script>

<script src="practice.js"></script>
</body>
</html>
