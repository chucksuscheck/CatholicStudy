window.PRAYER={
 key:"mem",title:"The Memorare",eyebrow:"Memorare",incipit:"Memorare, O piissima Virgo Maria…",
 emblem:"rose",heroPos:"45% 55%",placeholder:"Remember, O most gracious Virgin Mary…",
 about:["Its name is its first Latin word: <i>Memorare</i>, “Remember.” Long attributed to St. Bernard of Clairvaux, it was spread widely in the 17th century by Fr. Claude Bernard, “the Poor Priest” of Paris.",
        "It is a prayer of confident trust, often prayed in times of special need."],
 moves:[
 {name:"The appeal",hook:"<strong>Remember.</strong> The whole prayer hangs on this one word, spoken to the most gracious Virgin.",
  lines:["Remember, O most gracious Virgin Mary,"],
  latin:["Memorare, O piissima Virgo Maria,"]},
 {name:"Never known",hook:"<strong>Fled, implored, sought → never unaided.</strong> Three ways of asking: protection, help, intercession.",
  lines:["that never was it known that anyone who fled to thy protection,","implored thy help, or sought thine intercession","was left unaided."],
  latin:["non esse auditum a saeculo, quemquam ad tua currentem praesidia,","tua implorantem auxilia, tua petentem suffragia,","esse derelictum."]},
 {name:"I come to you",hook:"<strong>Fly → come → stand.</strong> Each step brings me closer, until I stand before her, sinful and sorrowful.",
  lines:["Inspired by this confidence,","I fly unto thee, O Virgin of virgins, my Mother;","to thee do I come, before thee I stand, sinful and sorrowful."],
  latin:["Ego tali animatus confidentia,","ad te, Virgo Virginum, Mater, curro,","ad te venio, coram te gemens peccator assisto."]},
 {name:"Hear me",hook:"<strong>Despise not → hear → answer.</strong> Mother of the Word, do not despise my words.",
  lines:["O Mother of the Word Incarnate, despise not my petitions,","but in thy mercy hear and answer me. Amen."],
  latin:["Noli, Mater Verbi, verba mea despicere;","sed audi propitia et exaudi. Amen."]}
 ]};
