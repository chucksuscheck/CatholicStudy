<script>
window.PRAYER={
 key:"stm",title:"Prayer to Saint Michael",eyebrow:"Sancte Michael",incipit:"Sancte Michael Archangele, defende nos in proelio…",
 emblem:"sword",placeholder:"Saint Michael the Archangel…",
 decoys:["Praise to the Trinity","The angel’s greeting","Sorrow for sin"],
 about:["Pope Leo XIII added this prayer in 1886 to the prayers said after Low Mass. That requirement ended in the 1960s, but many parishes have brought it back after Mass, and St. John Paul II encouraged all Catholics to pray it in 1994.",
        "Michael, whose name means “Who is like God?”, leads the heavenly army against Satan (Revelation 12:7–9). The Church keeps his feast with the archangels Gabriel and Raphael on September 29."],
 moves:[
 {name:"The call",desc:"Call on Saint Michael and ask him to defend us.",hook:"<strong>Name, then the ask:</strong> Saint Michael the Archangel → defend us in battle.",
  lines:["Saint Michael the Archangel,","defend us in battle."],
  latin:["Sancte Michael Archangele,","defende nos in proelio;"]},
 {name:"Our protection",desc:"Ask him to guard us from the devil’s evil and traps.",hook:"<strong>Protection against two things:</strong> the devil’s wickedness and his snares.",
  lines:["Be our protection against the wickedness","and snares of the devil."],
  latin:["contra nequitiam et insidias diaboli","esto praesidium."]},
 {name:"God’s rebuke",desc:"Ask humbly that God himself rebuke the devil.",hook:"<strong>God rebukes; we only ask.</strong> “We humbly pray” is said in the middle of the line.",
  lines:["May God rebuke him, we humbly pray;"],
  latin:["Imperet illi Deus, supplices deprecamur:"]},
 {name:"Cast out evil",desc:"Ask Michael, by God’s power, to drive Satan and the evil spirits into hell.",hook:"<strong>Who, by what power, does what, to whom:</strong> Prince of the heavenly hosts → by the power of God → cast into hell → Satan and the evil spirits → who prowl about → seeking the ruin of souls.",
  lines:["and do thou, O Prince of the heavenly hosts,","by the power of God,","cast into hell Satan, and all the evil spirits,","who prowl about the world","seeking the ruin of souls. Amen."],
  latin:["tuque, Princeps militiae caelestis,","Satanam aliosque spiritus malignos,","qui ad perditionem animarum","pervagantur in mundo,","divina virtute in infernum detrude. Amen."]}
 ]};
