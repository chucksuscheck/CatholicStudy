<script>
window.PRAYER={
 key:"paf",title:"The Our Father",eyebrow:"Pater Noster",incipit:"Pater noster, qui es in caelis…",
 emblem:"paternoster",placeholder:"Our Father…",
 decoys:["For the dead","Praise of Mary","Thanksgiving for creation"],
 about:["The prayer Jesus himself taught his disciples (Matthew 6:9–13; Luke 11:2–4). The Catechism, quoting Tertullian, calls it “truly the summary of the whole gospel.”",
        "It is prayed at every Mass."],
 moves:[
 {name:"Address",desc:"Speak to God as a child speaks to a father.",hook:"<strong>Who we speak to, and where he is.</strong> Father, in heaven.",
  lines:["Our Father, who art in heaven,"],
  latin:["Pater noster, qui es in caelis,"]},
 {name:"For God",desc:"Three wishes for God: honor for him, his reign, and his plan carried out everywhere.",hook:"<strong>Three “thy”s:</strong> thy name, thy kingdom, thy will. Then “on earth as it is in heaven.”",
  lines:["hallowed be thy name;","thy kingdom come,","thy will be done","on earth as it is in heaven."],
  latin:["sanctificetur nomen tuum.","Adveniat regnum tuum.","Fiat voluntas tua,","sicut in caelo et in terra."]},
 {name:"For our needs",desc:"Ask for what we need each day, and for mercy as we show it to others.",hook:"<strong>Give, then forgive.</strong> Bread for today; mercy as we show mercy.",
  lines:["Give us this day our daily bread,","and forgive us our trespasses,","as we forgive those who trespass against us;"],
  latin:["Panem nostrum quotidianum da nobis hodie,","et dimitte nobis debita nostra,","sicut et nos dimittimus debitoribus nostris."]},
 {name:"For protection",desc:"Ask God to guard us from sin and harm.",hook:"<strong>Lead not, deliver.</strong> Keep us from temptation, free us from evil.",
  lines:["and lead us not into temptation,","but deliver us from evil. Amen."],
  latin:["Et ne nos inducas in tentationem,","sed libera nos a malo. Amen."]}
 ]};
