<body>
<noscript>This memory practice needs JavaScript.</noscript>
<script>
window.PRAYER={
 key:"aoc",title:"Act of Contrition",eyebrow:"Actus Contritionis",incipit:"Deus meus, ex toto corde paenitet me…",
 emblem:"keys",heroPos:"50% 100%",placeholder:"O my God…",
 decoys:["Thanksgiving for forgiveness","Confessing my sins aloud","The angel’s greeting"],
 about:["The Catechism defines contrition as “sorrow of the soul and detestation for the sin committed, together with the resolution not to sin again” (CCC 1451).",
        "This prayer is said in Confession before absolution, and at any time to express sorrow for sin. Several approved versions exist; this is one of the most widely taught."],
 moves:[
 {name:"Sorrow",desc:"Tell God you are sorry for your sins.",hook:"<strong>Sorry for offending God.</strong> “Heartily” means from the heart.",
  lines:["O my God, I am heartily sorry","for having offended Thee,"],
  latin:["Deus meus, ex toto corde paenitet me","omnium meorum peccatorum,"]},
 {name:"Why I am sorry",desc:"Give the reasons for your sorrow: fear of punishment, but above all love for God.",hook:"<strong>Two reasons, the second greater:</strong> his just punishments, but most of all because sin offends him who is all good.",
  lines:["and I detest all my sins because of Thy just punishments,","but most of all because they offend Thee, my God,","who art all good and deserving of all my love."],
  latin:["eaque detestor, quia peccando, non solum poenas a Te iuste statutas promeritus sum,","sed praesertim quia offendi Te, summum bonum,","ac dignum qui super omnia diligaris."]},
 {name:"My resolve",desc:"Promise, relying on God’s help, to change and to stay away from what leads you into sin.",hook:"<strong>Resolve → grace → sin no more → avoid the near occasion.</strong> I promise, but only with his help.",
  lines:["I firmly resolve, with the help of Thy grace,","to sin no more","and to avoid the near occasion of sin. Amen."],
  latin:["Ideo firmiter propono, adiuvante gratia Tua,","de cetero me non peccaturum","peccandique occasiones proximas fugiturum. Amen."]}
 ]};
</script>
