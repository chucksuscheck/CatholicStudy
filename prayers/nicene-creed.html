<script>
window.PRAYER={
 key:"nic",title:"The Nicene Creed",eyebrow:"Symbolum Nicænum",incipit:"Credo in unum Deum, Patrem omnipotentem…",
 emblem:"nicene",placeholder:"I believe in one God…",
 parts:[{name:"Father and Son",from:0,to:2},{name:"Incarnation to return",from:2,to:5},{name:"Spirit and Church",from:5,to:7}],
 decoys:["The descent into hell","The communion of saints","The Last Supper"],
 about:["Formulated by the Councils of Nicaea (325) and Constantinople (381), it is the Church’s great profession of faith in the Trinity.",
        "It is professed at Mass on Sundays and solemnities. All bow at the words of the Incarnation."],
 moves:[
 {name:"The Father",desc:"Faith in God the Father, who created all that exists.",hook:"<strong>One God → Father → maker → all things.</strong> “Visible and invisible” closes the section.",
  lines:["I believe in one God,","the Father almighty,","maker of heaven and earth,","of all things visible and invisible."],
  latin:["Credo in unum Deum,","Patrem omnipotentem,","factorem caeli et terrae,","visibilium omnium et invisibilium."]},
 {name:"The eternal Son",desc:"Faith in Jesus, eternally from the Father and fully divine like him.",hook:"<strong>Three “from” pairs:</strong> God from God, Light from Light, true God from true God. Then begotten, not made.",
  lines:["I believe in one Lord Jesus Christ,","the Only Begotten Son of God,","born of the Father before all ages.","God from God, Light from Light,","true God from true God,","begotten, not made, consubstantial with the Father;","through him all things were made."],
  latin:["Et in unum Dominum Iesum Christum,","Filium Dei unigenitum,","et ex Patre natum ante omnia saecula.","Deum de Deo, lumen de lumine,","Deum verum de Deo vero,","genitum, non factum, consubstantialem Patri:","per quem omnia facta sunt."]},
 {name:"The Incarnation",desc:"Why the Son came to earth and took on human nature through Mary.",hook:"<strong>A descent in four steps:</strong> for us → came down → incarnate → became man. (Bow at these words.)",
  lines:["For us men and for our salvation","he came down from heaven,","and by the Holy Spirit was incarnate of the Virgin Mary,","and became man."],
  latin:["Qui propter nos homines et propter nostram salutem","descendit de caelis.","Et incarnatus est de Spiritu Sancto ex Maria Virgine,","et homo factus est."]},
 {name:"Death and rising",desc:"His Passion, death, Resurrection and Ascension.",hook:"<strong>Crucified, suffered, buried, rose, ascended, seated.</strong> “In accordance with the Scriptures” follows the rising.",
  lines:["For our sake he was crucified under Pontius Pilate,","he suffered death and was buried,","and rose again on the third day","in accordance with the Scriptures.","He ascended into heaven","and is seated at the right hand of the Father."],
  latin:["Crucifixus etiam pro nobis sub Pontio Pilato;","passus et sepultus est,","et resurrexit tertia die,","secundum Scripturas,","et ascendit in caelum,","sedet ad dexteram Patris."]},
 {name:"His return",desc:"He will come back at the end of time to judge, and reign forever.",hook:"<strong>Glory, judgment, no end.</strong> He will come, he will judge, his kingdom lasts.",
  lines:["He will come again in glory","to judge the living and the dead","and his kingdom will have no end."],
  latin:["Et iterum venturus est cum gloria,","iudicare vivos et mortuos,","cuius regni non erit finis."]},
 {name:"The Holy Spirit",desc:"Faith in the third Person of the Trinity and what he does.",hook:"<strong>Lord and giver of life, then three “who” lines:</strong> proceeds, is adored, has spoken.",
  lines:["I believe in the Holy Spirit, the Lord, the giver of life,","who proceeds from the Father and the Son,","who with the Father and the Son is adored and glorified,","who has spoken through the prophets."],
  latin:["Et in Spiritum Sanctum, Dominum et vivificantem:","qui ex Patre Filioque procedit.","Qui cum Patre et Filio simul adoratur et conglorificatur:","qui locutus est per prophetas."]},
 {name:"The Church and the life to come",desc:"The Church and its marks, Baptism, and what we hope for after death.",hook:"<strong>Believe, confess, look forward.</strong> One, holy, catholic, apostolic: the four marks of the Church.",
  lines:["I believe in one, holy, catholic and apostolic Church.","I confess one Baptism for the forgiveness of sins","and I look forward to the resurrection of the dead","and the life of the world to come. Amen."],
  latin:["Et unam, sanctam, catholicam et apostolicam Ecclesiam.","Confiteor unum baptisma in remissionem peccatorum.","Et exspecto resurrectionem mortuorum,","et vitam venturi saeculi. Amen."]}
