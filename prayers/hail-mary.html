<body>
<noscript>This memory practice needs JavaScript.</noscript>
<script>
window.PRAYER={
 key:"hmy",title:"Hail Mary",eyebrow:"Ave Maria",incipit:"Ave Maria, gratia plena…",
 emblem:"lily",heroPos:"55% 85%",placeholder:"Hail Mary, full of grace…",
 decoys:["Mary’s reply to the angel","Praise to the Trinity","Our plea"],
 about:["The first half joins the angel Gabriel’s greeting (Luke 1:28) to Elizabeth’s blessing (Luke 1:42). The closing petition was added by the Church and took its present form in the Roman Breviary of 1568.",
        "It is prayed three times in the Angelus."],
 moves:[
 {name:"The angel’s greeting",hook:"<strong>Hail → full of grace → the Lord is with thee.</strong> Gabriel’s words at the Annunciation.",
  lines:["Hail Mary, full of grace,","the Lord is with thee."],
  latin:["Ave Maria, gratia plena,","Dominus tecum."]},
 {name:"Elizabeth’s blessing",hook:"<strong>Blessed, then blessed again:</strong> first Mary, then the fruit of her womb. The name of Jesus is the center of the prayer.",
  lines:["Blessed art thou among women,","and blessed is the fruit of thy womb, Jesus."],
  latin:["Benedicta tu in mulieribus,","et benedictus fructus ventris tui, Iesus."]},
 {name:"The Church’s petition",hook:"<strong>Holy Mary → pray for us → now and at death.</strong> The two moments that matter most: now, and our last hour.",
  lines:["Holy Mary, Mother of God,","pray for us sinners,","now and at the hour of our death. Amen."],
  latin:["Sancta Maria, Mater Dei,","ora pro nobis peccatoribus,","nunc et in hora mortis nostrae. Amen."]}
 ]};
</script>
