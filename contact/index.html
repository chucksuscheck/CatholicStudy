<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Faith by Heart</title>
<meta name="description" content="Send a question or suggestion to Faith by Heart.">
<meta name="application-name" content="Faith by Heart">
<meta name="apple-mobile-web-app-title" content="Faith by Heart">
<meta property="og:site_name" content="Faith by Heart">
<meta property="og:title" content="Contact · Faith by Heart">
<meta property="og:description" content="Send a question or suggestion to Faith by Heart.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3F5A26">
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* Contact form. Messages go through Web3Forms (web3forms.com), which emails them to the site owner;
   hCaptcha and a hidden honeypot field keep robots out. */
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 14px var(--sans);color:var(--ink)}
.field input,.field textarea{font:16px/1.45 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.field textarea{min-height:160px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}   /* honeypot: hidden from people, filled by bots */
.send{align-self:flex-start;font:600 15px var(--sans);color:var(--card);background:var(--accent);border:0;border-radius:999px;padding:12px 22px;min-height:44px;cursor:pointer}
.send:disabled{opacity:.6;cursor:default}
.send:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{margin:0;font-size:15px;min-height:1.5em}
.status.ok{color:var(--accent);font-weight:600}
.status.err{color:#A8382A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.err{color:#EE917E}}
.h-captcha{min-height:78px}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-h">
    <div>
      <span class="eyebrow">Faith by Heart</span>
      <h1>Contact</h1>
      <p>A question, a suggestion, or a mistake to fix? Send a note and we’ll read it.</p>
    </div>
    <svg viewBox="-50 -50 100 100" aria-hidden="true" data-emblem="rose"></svg>
  </header>

  <form class="form" id="contact" action="https://api.web3forms.com/submit" method="POST" novalidate>
    <!-- Web3Forms access key: get one free at web3forms.com (enter the email address that should receive messages).
         It is meant to be public; it only lets this form send to that address. -->
    <input type="hidden" name="access_key" value="23179952-ba65-4db5-8d3c-80afa2038ed8">
    <input type="hidden" name="subject" value="New message from Faith by Heart">
    <input type="hidden" name="from_name" value="Faith by Heart website">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>

    <!-- hCaptcha, set up by the Web3Forms script below. -->
    <div class="h-captcha" data-captcha="true"></div>

    <button class="send" type="submit">Send message</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <footer><span>Your email address is only used to reply to you.</span><span>✦ Ora pro nobis</span></footer>
</div>
<script src="https://web3forms.com/client/script.js" async defer></script>
<script src="../shared/emblems.js"></script>
<script>
document.querySelectorAll("svg[data-emblem]").forEach(s=>window.drawEmblem(s,s.dataset.emblem));

// Send with fetch so the visitor stays on the page and sees the result here.
const form=document.getElementById("contact"), status=document.getElementById("status"), send=form.querySelector(".send");
const say=(msg,cls)=>{status.textContent=msg;status.className="status"+(cls?" "+cls:"");};
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(form.access_key.value.startsWith("YOUR-")){say("The contact form isn’t set up yet. Please try again later.","err");return;}
  // Check the fields ourselves (novalidate) so the messages match the page.
  for(const id of ["name","email","message"]){
    const f=form[id];
    if(!f.value.trim()||(id==="email"&&!f.validity.valid)){
      say(id==="email"&&f.value.trim()?"Please enter a valid email address.":`Please fill in your ${id}.`,"err");f.focus();return;
    }
  }
  const data=new FormData(form);
  if(!data.get("h-captcha-response")){say("Please complete the “I am human” check.","err");return;}
  send.disabled=true;say("Sending…");
  try{
    const r=await fetch(form.action,{method:"POST",headers:{Accept:"application/json"},body:data});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.success){form.reset();if(window.hcaptcha)window.hcaptcha.reset();say("Thank you. Your message has been sent.","ok");}
    else say(j.message?`Sorry, it didn’t send: ${j.message}`:"Sorry, it didn’t send. Please try again.","err");
  }catch(err){say("Sorry, it didn’t send. Please check your connection and try again.","err");}
  send.disabled=false;
});
</script>
<script src="../shared/nav.js"></script>
</body>
</html>
