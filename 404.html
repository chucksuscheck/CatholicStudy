<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Faith by Heart</title>
<meta name="application-name" content="Faith by Heart">
<meta name="apple-mobile-web-app-title" content="Faith by Heart">
<meta name="theme-color" content="#3F5A26">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Served by Vercel for any missing page, so links are root-relative. Same palette as the home page. */
:root{--bg:#F4EFE1;--card:#FFFDF6;--ink:#262A18;--muted:#666449;--line:#DDD5BC;--accent:#3F5A26;--gold:#94681E}
@media (prefers-color-scheme:dark){:root{--bg:#12150C;--card:#1B1F13;--ink:#ECE6D2;--muted:#A8A487;--line:#30351F;--accent:#B4C98A;--gold:#E2B865;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
  font-family:"Alegreya Sans",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:440px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 24px}
img{width:64px;height:64px;border-radius:14px}
.eyebrow{display:block;margin-top:18px;color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:Spectral,Georgia,serif;font-weight:500;font-size:34px;line-height:1.15;margin:6px 0 10px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:var(--accent);color:var(--card);text-decoration:none;font-weight:700;padding:10px 20px;border-radius:999px}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/favicon.svg" alt="">
  <span class="eyebrow">Faith by Heart</span>
  <h1>Page not found</h1>
  <p>This page doesn’t exist. The prayers are all on the home page.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
