<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catholic Prayer Study</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Home page: palette drawn from Robert Zünd's "The Road to Emmaus" (1877) — forest greens, ochre road, golden light, robe red.
   The painting is the hero; exercise cards follow. Add new exercises to the lists below. */
:root{
  --bg:#F4EFE1; --card:#FFFDF6; --ink:#262A18; --muted:#666449; --line:#DDD5BC;
  --accent:#3F5A26; --accent-deep:#1F2B12; --accent-soft:#E6EAD3; --gold:#94681E; --gold-bright:#E3BC6A; --gold-soft:#F5E9CC;
  --robe:#9E3B2A;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12150C; --card:#1B1F13; --ink:#ECE6D2; --muted:#A8A487; --line:#30351F;
  --accent:#B4C98A; --accent-deep:#1A2410; --accent-soft:#252C18; --gold:#E2B865; --gold-bright:#E9C677; --gold-soft:#2E2715;
  --robe:#E08A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12150C; --card:#1B1F13; --ink:#ECE6D2; --muted:#A8A487; --line:#30351F;
  --accent:#B4C98A; --accent-deep:#1A2410; --accent-soft:#252C18; --gold:#E2B865; --gold-bright:#E9C677; --gold-soft:#2E2715;
  --robe:#E08A72; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

.hero{margin:0;border-radius:20px;overflow:hidden;background:var(--accent-deep);box-shadow:0 10px 30px rgba(31,43,18,.18)}
.hero .art{position:relative;aspect-ratio:640/456;max-height:440px;width:100%;
  background:url("images/zund-road-to-emmaus.jpg") center 60%/cover no-repeat}
.hero .art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,26,10,.55) 0%,rgba(20,26,10,0) 38%,rgba(20,26,10,0) 55%,rgba(20,26,10,.85) 100%)}
.hero .top,.hero .bottom{position:absolute;left:0;right:0;z-index:1;padding:20px 22px}
.hero .top{top:0}
.hero .bottom{bottom:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,8.5vw,48px);line-height:1.05;margin:4px 0 0;color:#FFF8E6;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.quote{margin:0;font:italic clamp(15px,3.6vw,18px)/1.45 var(--serif);color:#FFF4D8;max-width:44ch;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.quote span{display:block;font:500 12.5px var(--sans);color:var(--gold-bright);font-style:normal;margin-top:4px;letter-spacing:.04em}
.hero figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 22px 14px;color:#D9D3B8;font-size:13.5px}
.hero figcaption .sub{color:#FFF8E6;font-size:15.5px}
.hero figcaption cite{font-style:italic;color:#A8A487}
@media (max-width:440px){.hero .art{aspect-ratio:4/5;background-position:62% 60%}}

.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sort{order:1;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.sort button{font:600 13px var(--sans);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.sort button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.badge{position:relative}
.note{margin:-2px 0 12px;font-size:14px;color:var(--muted)}
.note[hidden]{display:none}
.rank{position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font:700 12px var(--sans);color:var(--accent-deep);background:var(--gold-bright);box-shadow:0 0 0 2px var(--card)}

.list{display:flex;flex-direction:column;gap:10px}
a.feature{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
a.feature:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(31,43,18,.14)}
a.feature:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.badge{width:72px;height:72px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#5C7A36,var(--accent-deep));display:grid;place-items:center}
.feature .t{font:500 22px/1.2 var(--serif);color:var(--accent)}
.feature .d{font-size:14.5px;color:var(--muted);margin-top:2px}
.prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--gold-bright)}


footer{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <figure class="hero">
    <div class="art">
      <div class="top">
        <span class="eyebrow">Ad maiorem Dei gloriam</span>
        <h1>Catholic Prayer Study</h1>
      </div>
      <div class="bottom">
        <p class="quote">“Did not our hearts burn within us while he talked to us on the road?”<span>Luke 24:32</span></p>
      </div>
    </div>
    <figcaption><span class="sub">Memorize the prayers. Learn the faith. A few minutes a day.</span><cite>Robert Zünd, The Road to Emmaus, 1877</cite></figcaption>
  </figure>

  <section>
    <div class="sec-h"><h2>Prayers</h2>
      <div class="sort" role="group" aria-label="Sort prayers">
        <button type="button" data-sort="priority">Priority</button><button type="button" data-sort="alpha">A–Z</button>
      </div>
    </div>
    <p class="note" id="sortnote">Ranked by how often you’ll use them. Learn 1, 2, 3, 5, 6 and 8 and you can pray the full Rosary from memory.</p>
    <div class="list" id="prayers"></div>
  </section>

  <footer><span>Progress is saved in your browser on this device.</span><span>✦ Ora pro nobis</span></footer>
</div>
<script src="shared/emblems.js"></script>
<script>
// One card per prayer page. priority ranks them by how often you’ll use them; why is shown in Priority view. key matches the page's localStorage prefix, so each card can show saved progress.
const PRAYERS=[
 {href:"prayers/act-of-contrition.html",key:"aoc",priority:4,why:"Required in Confession",emblem:"keys",title:"Act of Contrition",latin:"Actus Contritionis",d:"Sorrow for sin and the resolve to change"},
 {href:"prayers/apostles-creed.html",key:"apc",priority:6,why:"Opens the Rosary; it’s also the baptismal creed",emblem:"apostles",title:"The Apostles’ Creed",latin:"Symbolum Apostolorum",d:"The faith of the Apostles"},
 {href:"prayers/fatima-prayer.html",key:"fat",priority:5,why:"Said after each decade of the Rosary",emblem:"fatima",title:"The Fatima Prayer",latin:"O mi Iesu",d:"Taught by Our Lady at Fatima for the Rosary"},
 {href:"prayers/glory-be.html",key:"glb",priority:3,why:"Ends every decade of the Rosary and many other prayers",emblem:"glory",title:"Glory Be",latin:"Gloria Patri",d:"Praise to the Trinity"},
 {href:"prayers/hail-mary.html",key:"hmy",priority:2,why:"53 of the Rosary’s beads, and the most-prayed Marian prayer",emblem:"lily",title:"Hail Mary",latin:"Ave Maria",d:"The angel’s greeting and the Church’s plea"},
 {href:"prayers/hail-holy-queen.html",key:"hhq",priority:8,why:"Closes the Rosary",emblem:"marian",title:"Hail, Holy Queen",latin:"Salve Regina",d:"The Marian antiphon that closes the Rosary"},
 {href:"prayers/memorare.html",key:"mem",priority:9,why:"A traditional devotion, not tied to the Mass or Rosary",emblem:"rose",title:"The Memorare",latin:"Memorare",d:"A prayer of confident trust in Mary"},
 {href:"prayers/nicene-creed.html",key:"nic",priority:7,why:"Said at every Sunday Mass, but it’s the longest, so learn it after the shorter prayers",emblem:"nicene",title:"The Nicene Creed",latin:"Symbolum Nicænum",d:"The creed professed at Sunday Mass"},
 {href:"prayers/our-father.html",key:"paf",priority:1,why:"Said at every Mass and in every decade of the Rosary",emblem:"paternoster",title:"The Our Father",latin:"Pater Noster",d:"The prayer Jesus taught us"}
];
const list=document.getElementById("prayers");
// priority = how often you’ll use them; alpha ignores a leading "The".
const SORTS={priority:(a,b)=>a.priority-b.priority,
             alpha:(a,b)=>a.title.replace(/^The /,"").localeCompare(b.title.replace(/^The /,""))};
let sort="priority";
try{sort=localStorage.getItem("home-sort")||sort;}catch(e){}
if(!SORTS[sort])sort="priority";
function card(p){
  let done={},best=null;
  try{done=JSON.parse(localStorage.getItem(p.key+"-done")||"{}");best=JSON.parse(localStorage.getItem(p.key+"-best"));}catch(e){}
  const n=["study","fade","cues","order","recall"].filter(s=>done[s]).length;
  const txt=(n===5?"Memorized ✦":n?`${n} of 5 steps`:"Not started")+(best!=null?` · best recital ${best}%`:"");
  const a=document.createElement("a");a.className="feature";a.href=p.href;
  a.innerHTML=`<div class="badge">${sort==="priority"?`<span class="rank" aria-label="Priority ${p.priority}">${p.priority}</span>`:""}<svg width="54" height="54" viewBox="-50 -50 100 100" aria-hidden="true"></svg></div>
    <div style="min-width:0"><div class="t">${p.title}</div><div class="d"><i>${p.latin}</i> · ${sort==="priority"?p.why:p.d}</div>
    <div class="prog"><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div><span>${txt}</span></div></div>`;
  window.drawEmblem(a.querySelector("svg"),p.emblem);
  return a;
}
function render(){
  list.replaceChildren(...[...PRAYERS].sort(SORTS[sort]).map(card));
  document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===sort));
  document.getElementById("sortnote").hidden=sort!=="priority";
}
document.querySelectorAll(".sort button").forEach(b=>b.onclick=()=>{
  sort=b.dataset.sort;try{localStorage.setItem("home-sort",sort);}catch(e){}render();});
render();
</script>
</body>
</html>
