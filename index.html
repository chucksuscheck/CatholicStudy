<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catholic Study</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Home page: same palette and type as the exercise pages. Add new exercises to the lists below. */
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#18213B; --muted:#5D6785; --line:#D9DEEB;
  --marian:#2C4C98; --marian-soft:#E3E9F7; --gold:#9C7A25;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --card:#151C31; --ink:#E5E9F4; --muted:#9AA4C0; --line:#28314C;
  --marian:#93ABEA; --marian-soft:#1F2A4A; --gold:#D6B460; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --card:#151C31; --ink:#E5E9F4; --muted:#9AA4C0; --line:#28314C;
  --marian:#93ABEA; --marian-soft:#1F2A4A; --gold:#D6B460; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,8vw,42px);line-height:1.1;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:15.5px}
h2{margin:0 0 8px;font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-decoration:none;transition:border-color .15s}
a.item:hover{border-color:var(--marian)}
a.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.item .t{font:500 21px/1.25 var(--serif);color:var(--marian)}
.item .d{font-size:14.5px;color:var(--muted);margin-top:2px}
.empty{font-size:14.5px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:14px 18px;margin:0}
footer{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Ad maiorem Dei gloriam</span>
    <h1>Catholic Study</h1>
    <p class="sub">Exercises for memorizing prayers and learning the faith.</p>
  </header>

  <section>
    <h2>Prayers</h2>
    <div class="list">
      <a class="item" href="prayers/hail-holy-queen.html">
        <div class="t">Hail, Holy Queen</div>
        <div class="d">Salve Regina · five exercises, from reading to reciting it cold</div>
      </a>
    </div>
  </section>

  <section>
    <h2>Concepts</h2>
    <p class="empty">Coming soon.</p>
  </section>

  <footer>Progress is saved in your browser on this device.</footer>
</div>
</body>
</html>
